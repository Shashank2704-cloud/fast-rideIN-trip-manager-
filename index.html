<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FastRide Trip Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🚕 FastRide Trip Manager</h1>
        <p>Ride With Comfort and Safety</p>
    </header>

    <main>

        <!-- Dashboard -->
        <section class="dashboard">

            <div class="card">
                <h3>Total Trips</h3>
                <p id="totalTrips">0</p>
            </div>

            <div class="card">
                <h3>Pending</h3>
                <p id="pendingTrips">0</p>
            </div>

            <div class="card">
                <h3>Completed</h3>
                <p id="completedTrips">0</p>
            </div>

        </section>


        <!-- Add Trip -->
        <section class="trip-form">

            <h2>➕ Add New Trip</h2>

            <input
                type="text"
                id="customerName"
                placeholder="Customer Name"
            >

            <input
                type="text"
                id="pickup"
                placeholder="Pickup Location"
            >

            <input
                type="text"
                id="destination"
                placeholder="Destination"
            >

            <input
                type="text"
                id="driverName"
                placeholder="Driver Name"
            >

            <input
                type="text"
                id="vehicleNumber"
                placeholder="Vehicle Number"
            >

            <label>Trip Date</label>

            <input
                type="date"
                id="tripDate"
            >

            <label>Trip Status</label>

            <select id="tripStatus">

                <option value="Pending">
                    Pending
                </option>

                <option value="Ongoing">
                    Ongoing
                </option>

                <option value="Completed">
                    Completed
                </option>

            </select>


            <label>Payment Status</label>

            <select id="paymentStatus">

                <option value="Unpaid">
                    Unpaid
                </option>

                <option value="Paid">
                    Paid
                </option>

            </select>


            <button onclick="addTrip()">
                Add Trip
            </button>

        </section>


        <!-- Trip List -->
        <section class="trip-list">

            <h2>📋 Trip List</h2>

            <div id="tripContainer">

                <p class="empty">
                    No trips added yet.
                </p>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
